<ul class="list-of-summaries">
    {{ range first 5 (where site.RegularPages "Section" "notes") }}
    <li>
        <span class="bullet">{{ .Date.Format "02 Jan 2006" }}</span>
        <span class="content">
            <a href="{{ .RelPermalink }}">{{ .Title }}</a> –
            <span>{{ .Summary }}</span>
        </span>
    </li>
    {{ end }}
</ul>
