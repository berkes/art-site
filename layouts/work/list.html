{{ define "main" }}
<h1>Work</h1>

<ul class="gallery">
    {{ range .Pages.ByDate.Reverse }}
    <li>
        {{ $image := .Resources.Get .Params.image }}
        <a href="{{ .RelPermalink }}">
            <img src="{{ $image.RelPermalink }}" alt="Screenshot of {{ .Title }}">
        </a>
        <p><a href="{{ .RelPermalink }}">{{ .Title }}</a></p>
    </li>
    {{ end }}
</ul>
{{ end }}
