{{ define "main" }}
  <h1>Notes</h1>
  <ul class="list-of-summaries">
      {{ range .Pages.ByDate.Reverse }}
      <li>
          <span class="bullet">{{ .Date.Format "02 Jan 2006" }}</span>
          <span class="content">
              <a href="{{ .RelPermalink }}">{{ .Title }}</a> –
              <span>{{ .Summary }}</span>
          </span>
      </li>
      {{ end }}
  </ul>
{{ end }}
